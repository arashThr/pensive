{{- $app := .Site.Params.appURL | default "" -}}
<header class="bg-main border-b border-main sticky top-0 z-50" style="border-color:#222;">
  <div class="px-4 sm:px-6 max-w-6xl mx-auto">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
          <img src="/assets/title-logo.png" class="h-6" alt="Pensive" />
          <div class="font-bold text-lg text-main">
            Pensive <span class="text-xs font-medium accent bg-secondary px-2 py-1 rounded-full border border-main">Beta</span>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-4">
        <a href="{{ $app }}/signin" class="text-secondary hover:text-main font-medium transition-colors text-sm">Sign in</a>
        <a href="{{ $app }}/signup" class="border border-main text-main px-4 py-2 font-semibold rounded-lg hover:bg-secondary transition-colors text-sm">Sign up</a>
      </div>
    </div>
  </div>
</header>
